<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        padding: 36px;
      }
      .card {
        height: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        border: 1px solid var(--frame);
        background: var(--sheet);
      }
      .strip {
        font-size: 18px;
        padding: 14px 40px;
      }
      .band {
        min-height: 96px;
        padding: 0 40px;
      }
      .band .word {
        font-size: 36px;
        gap: 14px;
      }
      .band .word svg {
        width: 32px;
        height: 32px;
      }
      .band span {
        font: 500 20px/1 var(--sans);
      }
      .line {
        align-self: center;
        padding: 0 40px;
        font: 600 76px/0.98 var(--sans);
        letter-spacing: -0.035em;
        max-width: 15em;
        text-wrap: balance;
      }
      .figure b {
        font-size: 56px;
        padding: 20px 40px 16px;
      }
      .figure strong {
        font-size: 22px;
      }
      .figure p {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="mark" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="18" height="18" />
        <path d="M2 8h18M2 14h18M8 8v12" />
      </symbol>
    </svg>
    <div class="card">
      <p class="strip"><span>1 archive: texts, saves, videos, searches, posts, code, prompts</span><span>MIT, and a template you own</span></p>
      <div class="band">
        <span class="word"><svg aria-hidden="true"><use href="#mark" /></svg>commonplace</span>
        <span>your personal data kit for agents</span>
      </div>
      <p class="line">Your personal data, searchable by your agents.</p>
      <div class="figure">
        <b>~1,400</b>
        <div><strong>lines in the core</strong><p>0 runtime packages: Bun and its SQLite</p></div>
      </div>
    </div>
  </body>
</html>
